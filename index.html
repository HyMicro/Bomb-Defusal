<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#070C16" />
  <meta name="description" content="BOMB DEFUSAL: CHAOS EDITION — comic-arcade 2–4 player ice-breaking game for PID touchscreens." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>BOMB DEFUSAL: CHAOS EDITION — Comic Arcade for PID</title>
  <link rel="icon" href="assets/brand/logo-mark.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/fonts/fonts.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="game-shell" aria-label="BOMB DEFUSAL: CHAOS EDITION game screen">
    <div id="game-container"></div>
    <div id="crt" aria-hidden="true"></div>
    <div id="rotate-hint" aria-hidden="true">
      <div class="rotate-phone">⟳</div>
      <strong>PUTAR LAYAR KE LANDSCAPE</strong>
      <span>Game ini dirancang untuk layar PID 16:9.</span>
    </div>
  </main>

  <div id="boot-screen" aria-live="polite">
    <div class="boot-glow"></div>
    <img class="boot-brand" src="assets/brand/bomb-defusal-logo.png" alt="BOMB DEFUSAL: CHAOS EDITION" />
    <div class="boot-sub">MENYALAKAN SISTEM DEFUSAL...</div>
    <div class="boot-track"><div class="boot-fill" id="boot-fill"></div></div>
    <div class="boot-tip" id="boot-tip">Siapkan 2–4 pemain. Jangan panik.</div>
  </div>

  <div id="admin-root" aria-live="polite"></div>
  <noscript><div class="noscript">Aktifkan JavaScript untuk menjalankan game.</div></noscript>

  <script src="vendor/phaser.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
