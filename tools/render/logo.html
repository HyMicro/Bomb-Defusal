<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  .stage {
    position: relative; width: 1680px; height: 800px;
    background: transparent;
    font-family: 'Bangers', sans-serif;
    overflow: hidden;
  }
  .emblem { position: absolute; left: 8px; top: 102px; width: 540px; height: 540px; transform: rotate(-7deg); filter: drop-shadow(0 22px 26px rgba(4,7,14,.55)); }
  .brand { position: absolute; left: 518px; top: 44px; transform: rotate(-3deg); width: 1160px; }
  .bom { position: relative; font-size: 310px; line-height: .8; letter-spacing: 4px; color: #ffc928; -webkit-text-stroke: 18px #090d18; paint-order: stroke fill; text-shadow: 0 14px 0 #b51f34, 0 25px 0 #090d18, 0 40px 45px rgba(0,0,0,.45); }
  .bom .defusal { position: absolute; left: 604px; top: 58px; font-family: 'Lilita One'; font-size: 48px; letter-spacing: 4px; color: #f6ead6; -webkit-text-stroke: 0; text-shadow: 0 4px 0 #090d18; transform: rotate(2deg); }
  .challenge { position: relative; margin-top: 10px; margin-left: 20px; font-size: 208px; line-height: .8; letter-spacing: 2px; color: #f6ead6; -webkit-text-stroke: 15px #090d18; paint-order: stroke fill; text-shadow: 0 12px 0 #2b8bff, 0 24px 0 #090d18, 0 38px 40px rgba(0,0,0,.4); }
  .tag { position: absolute; left: 500px; top: 592px; transform: rotate(-2deg); background: linear-gradient(180deg,#ffdf6a,#ffc928 55%,#e9a80e); color: #1a1205; border: 6px solid #090d18; box-shadow: 0 8px 0 #090d18; font-family: 'Lilita One'; font-size: 31px; letter-spacing: 3px; padding: 13px 34px 16px; clip-path: polygon(2% 0, 100% 4%, 98% 100%, 0 94%); white-space: nowrap; }
  .chaos { position: absolute; left: 1240px; top: 610px; transform: rotate(3deg); font-family: 'Lilita One'; font-size: 25px; letter-spacing: 2px; background: #b55ddc; color: #fff; border: 5px solid #090d18; padding: 10px 20px; box-shadow: 0 6px 0 #090d18; }
  .spark { position: absolute; color: #ffc928; font-family: 'Bangers'; -webkit-text-stroke: 3px #090d18; }
  .s1 { left: 1480px; top: 42px; font-size: 86px; transform: rotate(12deg); }
  .s2 { left: 1590px; top: 404px; font-size: 56px; transform: rotate(-8deg); }
  .s3 { left: 506px; top: 14px; font-size: 44px; transform: rotate(18deg); color: #fff; }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <img class="emblem" src="../../assets/brand/logo-mark.svg" alt="">
    <div class="brand">
      <div class="bom">BOM<span class="defusal">DEFUSAL</span></div>
      <div class="challenge">CHALLENGE!</div>
    </div>
    <div class="tag">TEKA-TEKI &nbsp;•&nbsp; AKSI &nbsp;•&nbsp; KEKOMPAKAN</div>
    <div class="chaos">CHAOS EDITION</div>
    <div class="spark s1">✦</div>
    <div class="spark s2">✦</div>
    <div class="spark s3">✦</div>
  </div>
  <script>
    window.__READY = false;
    document.fonts.ready.then(() => { setTimeout(() => { window.__READY = true; }, 120); });
  </script>
</body>
</html>
