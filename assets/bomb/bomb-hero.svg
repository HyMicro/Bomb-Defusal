<svg xmlns="http://www.w3.org/2000/svg" width="560" height="640" viewBox="0 0 560 640" fill="none">
<defs><linearGradient id="ball" x1="0.2" y1="0.1" x2="0.85" y2="0.9"><stop offset="0" stop-color="#65708F" stop-opacity="1"/><stop offset="0.2" stop-color="#343E58" stop-opacity="1"/><stop offset="0.55" stop-color="#171D2D" stop-opacity="1"/><stop offset="1" stop-color="#080B13" stop-opacity="1"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8390AA" stop-opacity="1"/><stop offset="0.3" stop-color="#3A445C" stop-opacity="1"/><stop offset="1" stop-color="#161D2E" stop-opacity="1"/></linearGradient>
    <radialGradient id="hot" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFF3B0" stop-opacity="1"/><stop offset="0.35" stop-color="#FFC928" stop-opacity="1"/><stop offset="0.7" stop-color="#FF7A2E" stop-opacity="1"/><stop offset="1" stop-color="#FF414D" stop-opacity="0"/></radialGradient>
    <filter id="hotGlow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="b"/>
