    <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
    <filter id="bombShadow" x="-40%" y="-40%" width="180%" height="190%">
    <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#05070D" flood-opacity="0.48"/>
